name: Build StateRAM Phase 14 foreground-aware governor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase14:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Phase 14 SDK and validation harness
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio C++ toolchain not found" }
          $devcmd = Join-Path $vs "Common7\Tools\VsDevCmd.bat"

          cmd /c "`"$devcmd`" -arch=x64 -host_arch=x64 && cl /nologo /std:c++17 /O2 /EHsc /W4 /LD stateram_sdk.cpp /link Cabinet.lib /out:stateram_sdk.dll"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cmd /c "`"$devcmd`" -arch=x64 -host_arch=x64 && cl /nologo /std:c++17 /O2 /EHsc /W4 phase14_governor.cpp /link Psapi.lib Advapi32.lib /out:StateRAM_Phase14_Foreground_Aware.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Disposable cloud validation
        shell: powershell
        run: |
          .\StateRAM_Phase14_Foreground_Aware.exe --cloud-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Gate cloud validation
        shell: powershell
        run: |
          $r = Get-Content .\phase14_cloud_result.json -Raw | ConvertFrom-Json
          $r | ConvertTo-Json -Depth 8
          if (-not $r.pass) { throw "WINDOWS_STATERAM_PHASE14_CLOUD_GATE=FAIL" }
          if (-not (Test-Path .\phase14_cloud_switches.csv)) { throw "missing Phase 14 switch CSV" }
          Write-Host "WINDOWS_STATERAM_PHASE14_CLOUD_GATE=PASS"

      - name: Find Microsoft Defender scanner
        id: defender
        shell: powershell
        run: |
          $platformRoot = Join-Path $env:ProgramData "Microsoft\Windows Defender\Platform"
          $mp = $null

          if (Test-Path $platformRoot) {
            $latest = Get-ChildItem $platformRoot -Directory |
              Sort-Object Name -Descending |
              Select-Object -First 1

            if ($latest) {
              $candidate = Join-Path $latest.FullName "MpCmdRun.exe"
              if (Test-Path $candidate) { $mp = $candidate }
            }
          }

          if (-not $mp) {
            $candidate = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"
            if (Test-Path $candidate) { $mp = $candidate }
          }

          if (-not $mp) {
            throw "Microsoft Defender scanner unavailable. Failing closed."
          }

          "mp=$mp" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Defender scan
        shell: powershell
        run: |
          $mp = '${{ steps.defender.outputs.mp }}'

          & $mp -Scan -ScanType 3 -File "$PWD\StateRAM_Phase14_Foreground_Aware.exe"
          $exeCode = $LASTEXITCODE

          & $mp -Scan -ScanType 3 -File "$PWD\stateram_sdk.dll"
          $dllCode = $LASTEXITCODE

          @"
          Microsoft Defender verification
          =================================
          StateRAM_Phase14_Foreground_Aware.exe exit code: $exeCode
          stateram_sdk.dll exit code: $dllCode
          "@ | Set-Content -Encoding UTF8 .\DEFENDER_SCAN_REPORT.txt

          if ($exeCode -ne 0 -or $dllCode -ne 0) {
            throw "Defender scan did not return clean success. Failing closed."
          }

          Write-Host "MICROSOFT_DEFENDER_SCAN=PASS"

      - name: Create SHA-256 manifest
        shell: powershell
        run: |
          $exeHash = (Get-FileHash .\StateRAM_Phase14_Foreground_Aware.exe -Algorithm SHA256).Hash.ToLower()
          $dllHash = (Get-FileHash .\stateram_sdk.dll -Algorithm SHA256).Hash.ToLower()

          @"
          SHA256  StateRAM_Phase14_Foreground_Aware.exe  $exeHash
          SHA256  stateram_sdk.dll                       $dllHash
          "@ | Set-Content -Encoding ASCII .\SHA256SUMS.txt

          Get-Content .\SHA256SUMS.txt

      - name: Assemble guarded local package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .\StateRAM_Phase14_Local | Out-Null

          Copy-Item .\StateRAM_Phase14_Foreground_Aware.exe .\StateRAM_Phase14_Local\
          Copy-Item .\stateram_sdk.dll .\StateRAM_Phase14_Local\
          Copy-Item .\DEFENDER_SCAN_REPORT.txt .\StateRAM_Phase14_Local\
          Copy-Item .\SHA256SUMS.txt .\StateRAM_Phase14_Local\

          @'
          @echo off
          cd /d "%~dp0"
          echo StateRAM Phase 14 - foreground-aware CPU governor
          echo.
          echo IMPORTANT: run normally. Do NOT choose "Run as administrator".
          echo Save your current work before starting.
          echo.
          StateRAM_Phase14_Foreground_Aware.exe
          echo.
          echo Send ChatGPT these THREE files:
          echo   stateram_phase14_result.json
          echo   stateram_phase14_switches.csv
          echo   stateram_phase14_guard_result.json
          echo.
          pause
          '@ | Set-Content -Encoding ASCII .\StateRAM_Phase14_Local\RUN_PHASE14_SAFE.cmd

          @'
          StateRAM Phase 14 - Foreground-Aware CPU Governor

          Why:
          Phase 13 captured a ~249 ms visible stall while foreground-thread and
          whole-process CPU-cycle usage stayed almost identical to a normal
          ~5.6 ms switch. The process-cycle trace flatlined during most of the
          stall. This strongly implicated the whole-process hard CPU quota.

          Architectural change:
            OLD:
              35% hard CPU cap applies to ALL StateRAM threads
            NEW:
              foreground core-resume path can burst briefly at normal priority
              baseline/deep workers explicitly enter Windows background mode
              deep restoration yields after each 512 KiB
              memory pressure makes deep restoration yield more
              launcher watches sustained CPU behavior and aborts on abuse

          Hard protections that remain:
            - 320 MiB process-commit cap
            - one isolated child
            - kill-on-job-close
            - start only with >=1024 MiB available RAM
            - abort below 640 MiB available RAM
            - abort at >=88% memory load
            - sustained-CPU fail-safe watchdog
            - 120 second timeout
            - no driver/injection/registry/pagefile/boot changes

          Validation:
            - 96 repeated workspace switches
            - 50 ms visible-tail threshold
            - exact state-integrity check after each switch
            - deep/background metrics recorded

          Send the three generated result files to ChatGPT.
          '@ | Set-Content -Encoding UTF8 .\StateRAM_Phase14_Local\README_FIRST.txt

      - name: Upload cloud evidence
        uses: actions/upload-artifact@v4
        with:
          name: StateRAM-Phase14-Cloud-Validation
          path: |
            phase14_cloud_result.json
            phase14_cloud_switches.csv

      - name: Upload Defender-gated local package
        uses: actions/upload-artifact@v4
        with:
          name: StateRAM-Phase14-Local-Foreground-Aware
          path: StateRAM_Phase14_Local
