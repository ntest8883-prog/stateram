name: StateRAM decisive 4-to-12 proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decisive:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify host and userfaultfd
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          free -h
          swapon --show || true
          chmod +x *.sh *.py
          ./build.sh
          ./userfaultfd_probe 2>&1 | tee userfaultfd_probe.log
          grep -q "UFFDIO_API.*OK" userfaultfd_probe.log

      - name: Generate decisive full-coverage benchmark
        shell: bash
        run: |
          cat > stateram12_decisive.c <<'STATE_RAM_C_EOF'
          #define _GNU_SOURCE
          #include "stateram9.h"
          #include <errno.h>
          #include <inttypes.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/mman.h>
         
