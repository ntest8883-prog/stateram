name: Build StateRAM Phase 12 tail diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase12:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build validated Phase 11 SDK and Phase 12 diagnostic
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio C++ toolchain not found" }
          $devcmd = Join-Path $vs "Common7\Tools\VsDevCmd.bat"

          cmd /c "`"$devcmd`" -arch=x64 -host_arch=x64 && cl /nologo /std:c++17 /O2 /EHsc /W4 /LD stateram_sdk.cpp /link Cabinet.lib /out:stateram_sdk.dll"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cmd /c "`"$devcmd`" -arch=x64 -host_arch=x64 && cl /nologo /std:c++17 /O2 /EHsc /W4 phase12_tail.cpp /link Psapi.lib Advapi32.lib /out:StateRAM_Phase12_Tail_Diagnostic.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Disposable cloud telemetry smoke test
        shell: powershell
        run: |
          .\StateRAM_Phase12_Tail_Diagnostic.exe --cloud-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Gate diagnostic telemetry
        shell: powershell
        run: |
          $r = Get-Content .\phase12_cloud_result.json -Raw | ConvertFrom-Json
          $r | ConvertTo-Json -Depth 8
          if (-not $r.diagnostic_pass) { throw "WINDOWS_STATERAM_PHASE12_CLOUD_GATE=FAIL" }
          if (-not (Test-Path .\phase12_cloud_switches.csv)) { throw "missing switch telemetry CSV" }
          Write-Host "WINDOWS_STATERAM_PHASE12_CLOUD_GATE=PASS"

      - name: Find Microsoft Defender scanner
        id: defender
        shell: powershell
        run: |
          $platformRoot = Join-Path $env:ProgramData "Microsoft\Windows Defender\Platform"
          $mp = $null

          if (Test-Path $platformRoot) {
            $latest = Get-ChildItem $platformRoot -Directory |
              Sort-Object Name -Descending |
              Select-Object -First 1

            if ($latest) {
              $candidate = Join-Path $latest.FullName "MpCmdRun.exe"
              if (Test-Path $candidate) { $mp = $candidate }
            }
          }

          if (-not $mp) {
            $candidate = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"
            if (Test-Path $candidate) { $mp = $candidate }
          }

          if (-not $mp) {
            throw "Microsoft Defender scanner unavailable. Failing closed."
          }

          "mp=$mp" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Defender scan both binaries
        shell: powershell
        run: |
          $mp = '${{ steps.defender.outputs.mp }}'

          & $mp -Scan -ScanType 3 -File "$PWD\StateRAM_Phase12_Tail_Diagnostic.exe"
          $exeCode = $LASTEXITCODE

          & $mp -Scan -ScanType 3 -File "$PWD\stateram_sdk.dll"
          $dllCode = $LASTEXITCODE

          @"
          Microsoft Defender verification
          =================================
          StateRAM_Phase12_Tail_Diagnostic.exe exit code: $exeCode
          stateram_sdk.dll exit code: $dllCode
          "@ | Set-Content -Encoding UTF8 .\DEFENDER_SCAN_REPORT.txt

          if ($exeCode -ne 0 -or $dllCode -ne 0) {
            throw "Defender scan did not return clean success. Failing closed."
          }

          Write-Host "MICROSOFT_DEFENDER_SCAN=PASS"

      - name: Create SHA-256 manifest
        shell: powershell
        run: |
          $exeHash = (Get-FileHash .\StateRAM_Phase12_Tail_Diagnostic.exe -Algorithm SHA256).Hash.ToLower()
          $dllHash = (Get-FileHash .\stateram_sdk.dll -Algorithm SHA256).Hash.ToLower()

          @"
          SHA256  StateRAM_Phase12_Tail_Diagnostic.exe  $exeHash
          SHA256  stateram_sdk.dll                      $dllHash
          "@ | Set-Content -Encoding ASCII .\SHA256SUMS.txt

          Get-Content .\SHA256SUMS.txt

      - name: Assemble guarded local diagnostic package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .\StateRAM_Phase12_Local | Out-Null

          Copy-Item .\StateRAM_Phase12_Tail_Diagnostic.exe .\StateRAM_Phase12_Local\
          Copy-Item .\stateram_sdk.dll .\StateRAM_Phase12_Local\
          Copy-Item .\DEFENDER_SCAN_REPORT.txt .\StateRAM_Phase12_Local\
          Copy-Item .\SHA256SUMS.txt .\StateRAM_Phase12_Local\

          @'
          @echo off
          cd /d "%~dp0"
          echo StateRAM Phase 12 - narrow tail-latency diagnosis
          echo.
          echo IMPORTANT: run normally. Do NOT choose "Run as administrator".
          echo Save your current work before starting.
          echo.
          StateRAM_Phase12_Tail_Diagnostic.exe
          echo.
          echo Send ChatGPT these THREE files:
          echo   stateram_phase12_tail_result.json
          echo   stateram_phase12_switches.csv
          echo   stateram_phase12_guard_result.json
          echo.
          pause
          '@ | Set-Content -Encoding ASCII .\StateRAM_Phase12_Local\RUN_PHASE12_SAFE.cmd

          @'
          StateRAM Phase 12 - Tail-Latency Diagnosis

          This is NOT another capacity test.

          It keeps the already validated Phase 11 mechanism and records every
          switch in detail so one rare long stall can be localized.

          For every switch it records:
            - total wall time
            - current-thread CPU time
            - inferred non-running/blocking time
            - outgoing dirty finalization time
            - outgoing VirtualFree/MEM_DECOMMIT time
            - dirty-page count
            - compact capsule size
            - incoming resume-core wall time
            - incoming SDK core-reconstruction time
            - deep-restore wall time
            - Windows memory load / available RAM

          Important interpretation:
          "THREAD_NOT_RUNNING_OR_BLOCKED" means wall time greatly exceeded
          current-thread CPU time. That can include scheduling, the Phase 11
          safety Job Object CPU cap, or blocking inside an OS call. It is NOT
          automatically proof of one specific cause.

          Safety envelope is unchanged from Phase 11:
            - no Administrator
            - 320 MiB hard child commit cap
            - 35% hard CPU cap
            - BELOW_NORMAL priority
            - abort >=88% memory load
            - abort below 640 MiB available RAM
            - refuse start below 1024 MiB available RAM
            - 120 second timeout
            - no drivers/injection/registry/pagefile/boot changes

          A long tail is NOT a failed diagnostic. The diagnostic passes when
          telemetry is complete and state integrity remains correct.
          '@ | Set-Content -Encoding UTF8 .\StateRAM_Phase12_Local\README_FIRST.txt

      - name: Upload cloud diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: StateRAM-Phase12-Cloud-Diagnostic
          path: |
            phase12_cloud_result.json
            phase12_cloud_switches.csv

      - name: Upload Defender-gated local diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: StateRAM-Phase12-Local-Tail-Diagnostic
          path: StateRAM_Phase12_Local
