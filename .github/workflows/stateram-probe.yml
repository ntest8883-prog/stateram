name: StateRAM Windows Phase 4 external capsule

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase4:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with MSVC
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio C++ toolchain not found" }
          $devcmd = Join-Path $vs "Common7\Tools\VsDevCmd.bat"
          cmd /c "`"$devcmd`" -arch=x64 -host_arch=x64 && cl /nologo /std:c++17 /O2 /EHsc /W4 stateram_phase4_capsule.cpp /link Psapi.lib Cabinet.lib /out:stateram_phase4_capsule.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run one external-capsule experiment
        shell: powershell
        run: |
          .\stateram_phase4_capsule.exe `
            --parent `
            --mb 256 `
            --json windows_phase4.json

      - name: Gate
        shell: powershell
        run: |
          $r = Get-Content .\windows_phase4.json -Raw | ConvertFrom-Json
          $r | ConvertTo-Json -Depth 5
          if (-not $r.pass) { throw "WINDOWS_STATERAM_PHASE4_GATE=FAIL" }
          Write-Host "WINDOWS_STATERAM_PHASE4_GATE=PASS"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stateram-windows-phase4-results
          path: windows_phase4.json
