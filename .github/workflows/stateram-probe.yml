name: Build StateRAM Phase 11 workspace switching

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase11:
    runs-on: windows-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Phase 11 SDK and workspace harness
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio C++ toolchain not found" }
          $devcmd = Join-Path $vs "Common7\Tools\VsDevCmd.bat"

          cmd /c "`"$devcmd`" -arch=x64 -host_arch=x64 && cl /nologo /std:c++17 /O2 /EHsc /W4 /LD stateram_sdk.cpp /link Cabinet.lib /out:stateram_sdk.dll"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cmd /c "`"$devcmd`" -arch=x64 -host_arch=x64 && cl /nologo /std:c++17 /O2 /EHsc /W4 phase11_workspace.cpp /link Psapi.lib Advapi32.lib /out:StateRAM_Workspace_SafeTest.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Disposable runner smoke test of NEW re-dormancy lifecycle
        shell: powershell
        run: |
          .\StateRAM_Workspace_SafeTest.exe --cloud-smoke

      - name: Gate cloud smoke
        shell: powershell
        run: |
          $r = Get-Content .\phase11_cloud_smoke.json -Raw | ConvertFrom-Json
          $r | ConvertTo-Json -Depth 8
          if (-not $r.pass) { throw "WINDOWS_STATERAM_PHASE11_CLOUD_GATE=FAIL" }
          Write-Host "WINDOWS_STATERAM_PHASE11_CLOUD_GATE=PASS"

      - name: Assemble guarded local package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .\StateRAM_Phase11_Local | Out-Null
          Copy-Item .\StateRAM_Workspace_SafeTest.exe .\StateRAM_Phase11_Local\
          Copy-Item .\stateram_sdk.dll .\StateRAM_Phase11_Local\

          @'
          @echo off
          cd /d "%~dp0"
          echo StateRAM Phase 11 - realistic isolated workspace switching
          echo.
          echo IMPORTANT: run normally. Do NOT choose "Run as administrator".
          echo Save your current work before starting.
          echo.
          StateRAM_Workspace_SafeTest.exe
          echo.
          echo Send ChatGPT:
          echo   stateram_phase11_local_result.json
          echo   stateram_phase11_guard_result.json
          echo.
          pause
          '@ | Set-Content -Encoding ASCII .\StateRAM_Phase11_Local\RUN_PHASE11_SAFE.cmd

          @'
          StateRAM Phase 11 - Realistic Isolated Workspace Switching

          This remains isolated. It does NOT modify Chrome, VS Code, Windows,
          or any other application's memory.

          It simulates:
            - 6 workspaces
            - 24 MiB state per workspace
            - 2 MiB immediately resumable core per workspace
            - document/code/history/cache-like state
            - 18 repeated workspace switches
            - small foreground edits between switches

          The new Phase 11 mechanism keeps a compact capsule for short-lived
          foreground workspaces and re-arms Windows write tracking after each
          full restoration. That lets a workspace return to dormant form
          without rebuilding its entire baseline every time.

          Safety:
            - normal user only; no Administrator
            - 320 MiB hard child commit cap
            - 35% hard CPU cap
            - BELOW_NORMAL priority
            - watchdog every 250 ms
            - abort at >=88% memory load
            - abort below 640 MiB available RAM
            - refuses to start below 1024 MiB available RAM or above 80% load
            - 120 second maximum runtime
            - no driver, registry, pagefile, boot, or install changes
            - JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE

          A watchdog abort means the guard protected the machine.

          Send these files after the run:
            stateram_phase11_local_result.json
            stateram_phase11_guard_result.json
          '@ | Set-Content -Encoding UTF8 .\StateRAM_Phase11_Local\README_FIRST.txt

      - name: Upload cloud evidence
        uses: actions/upload-artifact@v4
        with:
          name: StateRAM-Phase11-Cloud-Smoke
          path: phase11_cloud_smoke.json

      - name: Upload ready-to-run guarded local package
        uses: actions/upload-artifact@v4
        with:
          name: StateRAM-Phase11-Local-Safe-Test
          path: StateRAM_Phase11_Local
