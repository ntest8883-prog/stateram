name: StateRAM-13 final performance candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and verify userfaultfd
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          free -h
          swapon --show || true
          chmod +x *.sh *.py
          ./build_final.sh
          ./userfaultfd_probe 2>&1 | tee userfaultfd_probe.log
          grep -q "UFFDIO_API.*OK" userfaultfd_probe.log

      - name: Same-runner 12 GiB RAW reference
        shell: bash
        run: |
          set -euxo pipefail
          ./stateram13_final_bench \
            --mode raw \
            --logical-gb 12 \
            --objects 24 \
            --segment-kb 256 \
            --raw-target-mb 3000 \
            --shadow-depth 0 \
            --profile normal \
            --steps 2000 \
            --csv stateram13_raw_12g_reference.csv \
            2>&1 | tee stateram13_raw_12g_reference.log
          python3 analyze.py stateram13_raw_12g_reference.csv \
            | tee stateram13_raw_12g_reference_analysis.json

      - name: Final 4 to 12 StateRAM-13 run
        shell: bash
        run: |
          set -euxo pipefail
          sudo ./run_in_cgroup.py --memory 4G --swap 0 -- \
            ./stateram13_final_bench \
              --mode stateram \
              --logical-gb 12 \
              --objects 24 \
              --segment-kb 256 \
              --raw-target-mb 3000 \
              --shadow-depth 32 \
              --profile normal \
              --steps 2000 \
              --csv stateram13_final_4to12.csv \
            2>&1 | tee stateram13_final_4to12.log
          python3 analyze.py stateram13_final_4to12.csv \
            | tee stateram13_final_4to12_analysis.json

      - name: Final candidate comparison
        shell: bash
        run: |
          set -euxo pipefail
          python3 final_compare.py \
            stateram13_raw_12g_reference.csv \
            stateram13_final_4to12.csv \
            | tee stateram13_final_gate.log

      - name: Upload final results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stateram13-final-results
          if-no-files-found: warn
          path: |
            stateram13_*.csv
            stateram13_*.log
            stateram13_*_analysis.json
            stateram13_final_comparison.json
            userfaultfd_probe.log
