name: StateRAM decisive 4-to-12 proof v2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decisive:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and verify userfaultfd
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          free -h
          swapon --show || true
          chmod +x *.sh *.py
          ./build.sh
          ./userfaultfd_probe 2>&1 | tee userfaultfd_probe.log
          grep -q "UFFDIO_API.*OK" userfaultfd_probe.log

