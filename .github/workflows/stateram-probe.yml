name: Build StateRAM Phase 13 rare-stall catcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase13:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unchanged Phase 11 SDK and Phase 13 catcher
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio C++ toolchain not found" }
          $devcmd = Join-Path $vs "Common7\Tools\VsDevCmd.bat"

          cmd /c "`"$devcmd`" -arch=x64 -host_arch=x64 && cl /nologo /std:c++17 /O2 /EHsc /W4 /LD stateram_sdk.cpp /link Cabinet.lib /out:stateram_sdk.dll"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cmd /c "`"$devcmd`" -arch=x64 -host_arch=x64 && cl /nologo /std:c++17 /O2 /EHsc /W4 phase13_tailcatch.cpp /link Psapi.lib Advapi32.lib /out:StateRAM_Phase13_Rare_Stall_Catcher.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Disposable cloud telemetry smoke
        shell: powershell
        run: |
          .\StateRAM_Phase13_Rare_Stall_Catcher.exe --cloud-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Gate cloud smoke
        shell: powershell
        run: |
          $r = Get-Content .\phase13_cloud_result.json -Raw | ConvertFrom-Json
          $r | ConvertTo-Json -Depth 8
          if (-not $r.diagnostic_pass) { throw "WINDOWS_STATERAM_PHASE13_CLOUD_GATE=FAIL" }
          if (-not (Test-Path .\phase13_cloud_switches.csv)) { throw "missing Phase 13 switch CSV" }
          Write-Host "WINDOWS_STATERAM_PHASE13_CLOUD_GATE=PASS"

      - name: Find Microsoft Defender scanner
        id: defender
        shell: powershell
        run: |
          $platformRoot = Join-Path $env:ProgramData "Microsoft\Windows Defender\Platform"
          $mp = $null

          if (Test-Path $platformRoot) {
            $latest = Get-ChildItem $platformRoot -Directory |
              Sort-Object Name -Descending |
              Select-Object -First 1

            if ($latest) {
              $candidate = Join-Path $latest.FullName "MpCmdRun.exe"
              if (Test-Path $candidate) { $mp = $candidate }
            }
          }

          if (-not $mp) {
            $candidate = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"
            if (Test-Path $candidate) { $mp = $candidate }
          }

          if (-not $mp) {
            throw "Microsoft Defender scanner unavailable. Failing closed."
          }

          "mp=$mp" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Defender scan
        shell: powershell
        run: |
          $mp = '${{ steps.defender.outputs.mp }}'

          & $mp -Scan -ScanType 3 -File "$PWD\StateRAM_Phase13_Rare_Stall_Catcher.exe"
          $exeCode = $LASTEXITCODE

          & $mp -Scan -ScanType 3 -File "$PWD\stateram_sdk.dll"
          $dllCode = $LASTEXITCODE

          @"
          Microsoft Defender verification
          =================================
          StateRAM_Phase13_Rare_Stall_Catcher.exe exit code: $exeCode
          stateram_sdk.dll exit code: $dllCode
          "@ | Set-Content -Encoding UTF8 .\DEFENDER_SCAN_REPORT.txt

          if ($exeCode -ne 0 -or $dllCode -ne 0) {
            throw "Defender scan did not return clean success. Failing closed."
          }

          Write-Host "MICROSOFT_DEFENDER_SCAN=PASS"

      - name: Create SHA-256 manifest
        shell: powershell
        run: |
          $exeHash = (Get-FileHash .\StateRAM_Phase13_Rare_Stall_Catcher.exe -Algorithm SHA256).Hash.ToLower()
          $dllHash = (Get-FileHash .\stateram_sdk.dll -Algorithm SHA256).Hash.ToLower()

          @"
          SHA256  StateRAM_Phase13_Rare_Stall_Catcher.exe  $exeHash
          SHA256  stateram_sdk.dll                         $dllHash
          "@ | Set-Content -Encoding ASCII .\SHA256SUMS.txt

          Get-Content .\SHA256SUMS.txt

      - name: Assemble guarded local catcher
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .\StateRAM_Phase13_Local | Out-Null

          Copy-Item .\StateRAM_Phase13_Rare_Stall_Catcher.exe .\StateRAM_Phase13_Local\
          Copy-Item .\stateram_sdk.dll .\StateRAM_Phase13_Local\
          Copy-Item .\DEFENDER_SCAN_REPORT.txt .\StateRAM_Phase13_Local\
          Copy-Item .\SHA256SUMS.txt .\StateRAM_Phase13_Local\

          @'
          @echo off
          cd /d "%~dp0"
          echo StateRAM Phase 13 - rare-stall catcher
          echo.
          echo IMPORTANT: run normally. Do NOT choose "Run as administrator".
          echo Save your current work before starting.
          echo.
          StateRAM_Phase13_Rare_Stall_Catcher.exe
          echo.
          echo Send ChatGPT these FOUR files:
          echo   stateram_phase13_tailcatch_result.json
          echo   stateram_phase13_switches.csv
          echo   stateram_phase13_process_trace.csv
          echo   stateram_phase13_guard_result.json
          echo.
          pause
          '@ | Set-Content -Encoding ASCII .\StateRAM_Phase13_Local\RUN_PHASE13_SAFE.cmd

          @'
          StateRAM Phase 13 - Rare-Stall Catcher

          This is one focused experiment. It DOES NOT alter the Phase 11 engine.

          Local behavior:
            - same 6 x 24 MiB workspaces
            - same 2 MiB resume core
            - same 35% hard child CPU cap
            - same 320 MiB hard child commit cap
            - repeats switching for at most 96 switches
            - stops after the FIRST switch >= 50 ms
            - exits normally if no rare tail appears

          High-resolution evidence:
            - QueryPerformanceCounter wall timing
            - QueryThreadCycleTime raw cycle deltas
            - QueryProcessCycleTime raw cycle deltas
            - process PageFaultCount before/after each switch
            - private/working-set size
            - GetSystemTimes busy percentage across each switch
            - SDK finalization/decommit/core-restore timing
            - launcher-side child trace about every 10 ms

          IMPORTANT:
          CPU cycle counts are used ONLY as relative deltas versus normal
          switches in the same run. They are not converted to milliseconds.

          Safety:
            - no Administrator
            - no driver/injection
            - no registry/pagefile/boot changes
            - refuse start below 1024 MiB available RAM
            - abort below 640 MiB available RAM
            - abort at >=88% memory load
            - 120 second hard timeout

          Send all four generated result files to ChatGPT.
          '@ | Set-Content -Encoding UTF8 .\StateRAM_Phase13_Local\README_FIRST.txt

      - name: Upload cloud evidence
        uses: actions/upload-artifact@v4
        with:
          name: StateRAM-Phase13-Cloud-Diagnostic
          path: |
            phase13_cloud_result.json
            phase13_cloud_switches.csv

      - name: Upload Defender-gated local catcher
        uses: actions/upload-artifact@v4
        with:
          name: StateRAM-Phase13-Local-Rare-Stall-Catcher
          path: StateRAM_Phase13_Local
