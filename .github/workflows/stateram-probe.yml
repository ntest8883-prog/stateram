name: Build and Defender-scan StateRAM Phase 11

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Phase 11
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio C++ toolchain not found" }
          $devcmd = Join-Path $vs "Common7\Tools\VsDevCmd.bat"

          cmd /c "`"$devcmd`" -arch=x64 -host_arch=x64 && cl /nologo /std:c++17 /O2 /EHsc /W4 /LD stateram_sdk.cpp /link Cabinet.lib /out:stateram_sdk.dll"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cmd /c "`"$devcmd`" -arch=x64 -host_arch=x64 && cl /nologo /std:c++17 /O2 /EHsc /W4 phase11_workspace.cpp /link Psapi.lib Advapi32.lib /out:StateRAM_Workspace_SafeTest.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Phase 11 cloud smoke first
        shell: powershell
        run: |
          .\StateRAM_Workspace_SafeTest.exe --cloud-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Find Microsoft Defender command-line scanner
        id: defender
        shell: powershell
        run: |
          $platformRoot = Join-Path $env:ProgramData "Microsoft\Windows Defender\Platform"
          $mp = $null

          if (Test-Path $platformRoot) {
            $latest = Get-ChildItem $platformRoot -Directory |
              Sort-Object Name -Descending |
              Select-Object -First 1

            if ($latest) {
              $candidate = Join-Path $latest.FullName "MpCmdRun.exe"
              if (Test-Path $candidate) { $mp = $candidate }
            }
          }

          if (-not $mp) {
            $candidate = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"
            if (Test-Path $candidate) { $mp = $candidate }
          }

          if (-not $mp) {
            throw "Microsoft Defender MpCmdRun.exe is unavailable. Failing closed; no local executable artifact will be published."
          }

          "mp=$mp" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Using Defender scanner: $mp"

      - name: Microsoft Defender custom scan
        shell: powershell
        run: |
          $mp = '${{ steps.defender.outputs.mp }}'

          & $mp -Scan -ScanType 3 -File "$PWD\StateRAM_Workspace_SafeTest.exe"
          $exeCode = $LASTEXITCODE

          & $mp -Scan -ScanType 3 -File "$PWD\stateram_sdk.dll"
          $dllCode = $LASTEXITCODE

          @"
          Microsoft Defender verification
          =================================
          Scanner: $mp
          StateRAM_Workspace_SafeTest.exe exit code: $exeCode
          stateram_sdk.dll exit code: $dllCode
          "@ | Set-Content -Encoding UTF8 .\DEFENDER_SCAN_REPORT.txt

          if ($exeCode -ne 0 -or $dllCode -ne 0) {
            throw "Microsoft Defender scan did not return clean success for both binaries. Failing closed."
          }

          Write-Host "MICROSOFT_DEFENDER_SCAN=PASS"

      - name: Create SHA-256 manifest
        shell: powershell
        run: |
          $exeHash = (Get-FileHash .\StateRAM_Workspace_SafeTest.exe -Algorithm SHA256).Hash.ToLower()
          $dllHash = (Get-FileHash .\stateram_sdk.dll -Algorithm SHA256).Hash.ToLower()

          @"
          SHA256  StateRAM_Workspace_SafeTest.exe  $exeHash
          SHA256  stateram_sdk.dll                 $dllHash
          "@ | Set-Content -Encoding ASCII .\SHA256SUMS.txt

          Get-Content .\SHA256SUMS.txt

      - name: Assemble guarded local package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .\StateRAM_Phase11_Verified | Out-Null
          Copy-Item .\StateRAM_Workspace_SafeTest.exe .\StateRAM_Phase11_Verified\
          Copy-Item .\stateram_sdk.dll .\StateRAM_Phase11_Verified\
          Copy-Item .\DEFENDER_SCAN_REPORT.txt .\StateRAM_Phase11_Verified\
          Copy-Item .\SHA256SUMS.txt .\StateRAM_Phase11_Verified\

          @'
          @echo off
          cd /d "%~dp0"
          echo StateRAM Phase 11 - realistic isolated workspace switching
          echo.
          echo IMPORTANT: run normally. Do NOT choose "Run as administrator".
          echo Save your current work before starting.
          echo.
          StateRAM_Workspace_SafeTest.exe
          echo.
          echo Send ChatGPT:
          echo   stateram_phase11_local_result.json
          echo   stateram_phase11_guard_result.json
          echo.
          pause
          '@ | Set-Content -Encoding ASCII .\StateRAM_Phase11_Verified\RUN_PHASE11_SAFE.cmd

          @'
          This package was built on GitHub Actions and was only published if:
            1. Phase 11 cloud smoke passed.
            2. Microsoft Defender MpCmdRun custom scans returned success for
               both StateRAM_Workspace_SafeTest.exe and stateram_sdk.dll.
            3. SHA-256 hashes were recorded.

          IMPORTANT:
          - This does not make the executable digitally signed.
          - Browser reputation systems can still warn on a new unsigned binary.
          - Do not disable browser or Windows security protections globally.
          - Do not run as Administrator.
          '@ | Set-Content -Encoding UTF8 .\StateRAM_Phase11_Verified\README_VERIFIED.txt

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: StateRAM-Phase11-Verification-Evidence
          path: |
            DEFENDER_SCAN_REPORT.txt
            SHA256SUMS.txt
            phase11_cloud_smoke.json

      - name: Upload Defender-gated local package
        uses: actions/upload-artifact@v4
        with:
          name: StateRAM-Phase11-Defender-Verified-Local-Test
          path: StateRAM_Phase11_Verified
