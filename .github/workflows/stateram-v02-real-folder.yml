name: StateRAM v0.2 real folder workspace

on:
  workflow_dispatch:
  push:
    branches:
      - v0.2-real-folder-workspace

permissions:
  contents: read

jobs:
  validate-real-folder-integration:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct generated sources
        shell: powershell
        run: |
          $utf8 = New-Object System.Text.UTF8Encoding($false)

          $coreParts = @(
            ".\core-v01\src\stateram_core.part1",
            ".\core-v01\src\stateram_core.part2",
            ".\core-v01\src\stateram_core.part3",
            ".\core-v01\src\stateram_core.part4",
            ".\core-v01\src\stateram_core.part5",
            ".\core-v01\src\stateram_core.part6",
            ".\core-v01\src\stateram_core.part7"
          )

          $wbParts = @(
            ".\core-v01\workbench\workbench_win32.part1",
            ".\core-v01\workbench\workbench_win32.part2",
            ".\core-v01\workbench\workbench_win32.part3a",
            ".\core-v01\workbench\workbench_win32.part3b"
          )

          $evalParts = @(
            ".\core-v01\evaluation\evaluator.part1",
            ".\core-v01\evaluation\evaluator.part2",
            ".\core-v01\evaluation\evaluator.part3",
            ".\core-v01\evaluation\evaluator.part4"
          )

          $folderParts = @(
            ".\core-v01\integrations\folder_workspace.part1",
            ".\core-v01\integrations\folder_workspace.part2"
          )

          foreach ($f in ($coreParts + $wbParts + $evalParts + $folderParts)) {
            if (-not (Test-Path $f)) { throw "Missing source part: $f" }
          }

          $core = ($coreParts | ForEach-Object { Get-Content $_ -Raw }) -join ""
          [IO.File]::WriteAllText("$PWD\core-v01\src\stateram_core.cpp", $core, $utf8)

          $wb = ($wbParts | ForEach-Object { Get-Content $_ -Raw }) -join ""
          [IO.File]::WriteAllText("$PWD\core-v01\workbench\workbench_win32.cpp", $wb, $utf8)

          $ev = ($evalParts | ForEach-Object { Get-Content $_ -Raw }) -join ""
          [IO.File]::WriteAllText("$PWD\core-v01\evaluation\evaluator_win32.cpp", $ev, $utf8)

          $fw = ($folderParts | ForEach-Object { Get-Content $_ -Raw }) -join ""
          [IO.File]::WriteAllText("$PWD\core-v01\integrations\folder_workspace.cpp", $fw, $utf8)

          Write-Host "V02_SOURCE_RECONSTRUCTION=PASS"

      - name: Configure x64 Release
        shell: powershell
        run: |
          cmake -S .\core-v01 -B .\core-v01\build -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Core and folder workspace
        shell: powershell
        run: |
          cmake --build .\core-v01\build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Frozen Core self-check
        shell: powershell
        run: |
          Push-Location .\core-v01
          .\build\Release\stateram_core_selfcheck.exe
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { exit $code }
          Write-Host "STATERAM_CORE_V01_SELF_CHECK_WINDOWS=PASS"

      - name: Generate real on-disk corpus
        shell: powershell
        run: |
          $root = Join-Path $PWD "real-corpus"
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          $targetBytes = 768KB
          for ($i = 0; $i -lt 64; $i++) {
            $path = Join-Path $root ("document_{0:D3}.txt" -f $i)
            $marker = "needle-v02 file=$i StateRAM real-file integration "
            $filler = "This is actual file-backed corpus content for StateRAM v0.2 without the search marker. "
            $sb = New-Object System.Text.StringBuilder
            [void]$sb.Append($marker)
            while ($sb.Length -lt $targetBytes) {
              [void]$sb.Append($filler)
            }
            [IO.File]::WriteAllText($path, $sb.ToString(0, $targetBytes))
          }

          $count = (Get-ChildItem $root -File).Count
          $bytes = (Get-ChildItem $root -File | Measure-Object Length -Sum).Sum
          Write-Host "REAL_CORPUS_FILES=$count"
          Write-Host "REAL_CORPUS_MB=$([math]::Round($bytes/1MB,2))"

      - name: Real file-backed integration smoke
        shell: powershell
        run: |
          Push-Location .\core-v01
          $corpus = Resolve-Path ..\real-corpus
          .\build\Release\StateRAM_FolderWorkspace.exe --smoke $corpus "needle-v02"
          $code = $LASTEXITCODE

          if ($code -ne 0) {
            Pop-Location
            exit $code
          }

          if (-not (Test-Path .\stateram_v02_folder_smoke.json)) {
            Pop-Location
            throw "Missing StateRAM v0.2 folder smoke JSON"
          }

          $r = Get-Content .\stateram_v02_folder_smoke.json -Raw | ConvertFrom-Json
          $r | ConvertTo-Json -Depth 6

          if (-not $r.pass) { throw "Real folder smoke failed" }
          if ($r.files -ne 64) { throw "Expected 64 real files" }
          if ($r.logical_mb -lt 47 -or $r.logical_mb -gt 49) { throw "Unexpected logical corpus size" }
          if ($r.matches -le 0) { throw "Real search found no matches" }
          if ($r.raw_mb_after_trim -gt 40) { throw "Raw residency remained above trim envelope" }
          if ($r.promotions -le 0) { throw "No StateRAM promotions occurred" }
          if ($r.streaming_evictions -le 0) { throw "No StateRAM streaming evictions occurred" }
          if ($r.promotion_failures -ne 0) { throw "StateRAM promotion failure detected" }

          Copy-Item .\stateram_v02_folder_smoke.json ..\stateram_v02_folder_smoke.json
          Pop-Location

          Write-Host "STATERAM_V02_REAL_FOLDER_INTEGRATION=PASS"

      - name: Find Microsoft Defender scanner
        id: defender
        shell: powershell
        run: |
          $platformRoot = Join-Path $env:ProgramData "Microsoft\Windows Defender\Platform"
          $mp = $null

          if (Test-Path $platformRoot) {
            $latest = Get-ChildItem $platformRoot -Directory |
              Sort-Object Name -Descending |
              Select-Object -First 1
            if ($latest) {
              $candidate = Join-Path $latest.FullName "MpCmdRun.exe"
              if (Test-Path $candidate) { $mp = $candidate }
            }
          }

          if (-not $mp) {
            $candidate = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"
            if (Test-Path $candidate) { $mp = $candidate }
          }

          if (-not $mp) { throw "Microsoft Defender scanner unavailable" }
          "mp=$mp" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Defender scan real folder app
        shell: powershell
        run: |
          $mp = '${{ steps.defender.outputs.mp }}'
          $scanDir = Join-Path $PWD "defender-v02-scan"
          New-Item -ItemType Directory -Force -Path $scanDir | Out-Null

          $files = @(
            ".\core-v01\build\Release\stateram_core.dll",
            ".\core-v01\build\Release\StateRAM_FolderWorkspace.exe",
            ".\core-v01\build\Release\StateRAM_FolderWorkspace_Safe.exe"
          )

          foreach ($f in $files) {
            if (-not (Test-Path $f)) { throw "Missing v0.2 binary: $f" }
            Copy-Item $f $scanDir
          }

          & $mp -Scan -ScanType 3 -File $scanDir
          $code = $LASTEXITCODE

          @(
            "ScanTarget=$scanDir"
            "MpCmdRunExitCode=$code"
          ) | Set-Content -Encoding UTF8 .\STATERAM_V02_DEFENDER_SCAN.txt

          if ($code -ne 0) { throw "Defender scan failed with exit code $code" }
          Write-Host "STATERAM_V02_DEFENDER_SCAN=PASS"

      - name: Assemble real folder workspace package
        shell: powershell
        run: |
          $dst = ".\StateRAM-v0.2-Real-Folder-Workspace"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null

          Copy-Item .\core-v01\build\Release\stateram_core.dll $dst\
          Copy-Item .\core-v01\build\Release\StateRAM_FolderWorkspace.exe $dst\
          Copy-Item .\core-v01\build\Release\StateRAM_FolderWorkspace_Safe.exe $dst\
          Copy-Item .\core-v01\integrations\README_FOLDER_WORKSPACE.md $dst\
          Copy-Item .\STATERAM_V02_DEFENDER_SCAN.txt $dst\
          Copy-Item .\stateram_v02_folder_smoke.json $dst\

          @'
          @echo off
          cd /d "%~dp0"
          echo StateRAM v0.2 - Real Folder Workspace
          echo.
          echo Enter the full path of a folder containing text/code files.
          echo The application is READ-ONLY with respect to your files.
          echo Do not run as Administrator.
          echo.
          set /p TARGET=Folder path: 
          if "%TARGET%"=="" exit /b 1
          StateRAM_FolderWorkspace_Safe.exe "%TARGET%"
          pause
          '@ | Set-Content -Encoding ASCII "$dst\RUN_FOLDER_WORKSPACE_SAFE.cmd"

          $files = @(
            "$dst\stateram_core.dll",
            "$dst\StateRAM_FolderWorkspace.exe",
            "$dst\StateRAM_FolderWorkspace_Safe.exe"
          )

          $lines = foreach ($f in $files) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "SHA256  $([IO.Path]::GetFileName($f))  $h"
          }

          $lines | Set-Content -Encoding ASCII "$dst\SHA256SUMS.txt"

      - name: Upload integration evidence
        uses: actions/upload-artifact@v4
        with:
          name: StateRAM-v0.2-Real-Folder-Evidence
          path: |
            stateram_v02_folder_smoke.json
            STATERAM_V02_DEFENDER_SCAN.txt

      - name: Upload real folder workspace
        uses: actions/upload-artifact@v4
        with:
          name: StateRAM-v0.2-Real-Folder-Workspace
          path: StateRAM-v0.2-Real-Folder-Workspace
